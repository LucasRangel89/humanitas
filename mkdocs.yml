# Configuração do site (MkDocs Material).
# As fontes são montadas por `python -m scripts.painel site` em `site-src/`,
# que copia apenas o que pode ser público e GERA as páginas de navegação
# (painel inicial, índices por tema, eixos) a partir do índice.
#
# Uso local:
#   make site          # monta site-src/ e serve em http://127.0.0.1:8000
#   mkdocs build       # gera o HTML em site/
#
# Publicação: workflow "Site" (manual) em .github/workflows/site.yml.

site_name: Humanitas
site_description: Painel de estudos de ciências humanas — conceitos, eixos, trilhas e progresso
site_author: Lucas Rangel
# Em produção aponta para o GitHub Pages; no preview local, `MKDOCS_SITE_URL=/`.
site_url: !ENV [MKDOCS_SITE_URL, "https://lucasrangel89.github.io/humanitas/"]

docs_dir: site-src
site_dir: site

theme:
  name: material
  language: pt-BR
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Modo claro
  features:
    # Menu lateral com seções expansíveis (sem abas apertadas no topo).
    # `navigation.expand` fica desligado: só a seção ativa abre.
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.footer
    # conteúdo
    - content.tags
    - search.suggest
    - search.highlight
    - toc.follow
    - announce.dismiss

plugins:
  - search:
      lang: pt
      separator: '[\\s\\-,:!=\\[\\]()"\\./]'
  - tags

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html          # necessário para os cartões (grid cards) do painel
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - assets/css/dashboard.css
extra_javascript:
  - assets/js/dashboard.js
  - assets/js/progresso.js
  - assets/js/registrar.js

# Navegação explícita nas seções fixas. Notas novas NÃO exigem editar este
# arquivo: elas aparecem em Conceitos (índice gerado por tema), na busca, nas
# tags e nos links das trilhas.
nav:
  - Estudar:
      - Início: index.md
      - Trilhas: trilhas/index.md
      - Conceitos: conceitos/index.md
      - Eixos: eixos.md
  - Acompanhar:
      - Registrar: registrar.md
      - Diário: diario/index.md
      - Progresso: progresso.md
      - Retenção: retencao.md
  - Biblioteca:
      - Mídias: midias.md
      - Obras: obras.md
      - Fichas de leitura: acervo/fichas/index.md
      - Trechos: trechos/index.md
      - Grafo: grafo.md
  - Projeto:
      - Guias: docs/index.md
      - Mapa das humanidades: docs/09-mapa-das-humanidades.md
      - Ritual de estudo: docs/10-ritual-de-estudo.md
      - Mídias e videoaulas: docs/11-midias-e-videoaulas.md
      - Como manter o painel: docs/08-instrucoes-futuras.md
      - Sobre: sobre.md

extra:
  social:
    - icon: material/github
      link: https://github.com/LucasRangel89/humanitas
      name: Repositório no GitHub

