name: Painel — regenerar índice, tabela, progresso e flashcards

on:
  push:
    branches: [main]
    paths:
      - "conceitos/**"
      - "trilhas/**"
      - "diario/**"
      - "trechos/**"
      - "acervo/fichas/**"
      - "scripts/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: painel
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Regenerar artefatos
        run: python -m scripts.painel tudo

      - name: Publicar flashcards como artefato
        uses: actions/upload-artifact@v4
        with:
          name: flashcards
          path: flashcards.csv
          if-no-files-found: warn
