name: Painel — regenerar índice, tabela, progresso e flashcards

on:
  push:
    branches: [main]
    paths:
      - "conceitos/**"
      - "trilhas/**"
      - "diario/**"
      - "trechos/**"
      - "acervo/fichas/**"
      - "scripts/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: painel
  cancel-in-progress: false

jobs:
  atualizar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Regenerar artefatos
        run: python -m scripts.painel tudo

      - name: Publicar flashcards como artefato
        uses: actions/upload-artifact@v4
        with:
          name: flashcards
          path: flashcards.csv
          if-no-files-found: warn

      - name: Commitar os artefatos
        run: |
          git config user.name "painel-bot"
          git config user.email "painel-bot@users.noreply.github.com"
          git add README.md indices/indice.json progresso.md
          if git diff --cached --quiet; then
            echo "Nada mudou — nada a commitar."
          else
            git commit -m "chore: regenera índice, tabela de temas e progresso [skip ci]"
            git push
          fi
