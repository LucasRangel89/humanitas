# Mídias — biblioteca de videoaulas, artigos e outras obras
#
# Este é o único lugar onde se cadastra mídia externa. `make painel` gera
# `midias.md` (página pública) e `indices/midias.json` a partir daqui.
#
# REGRAS (ver docs/11-midias-e-videoaulas.md):
#   1. só entra o que foi ABERTO e conferido: título e autor copiados da fonte;
#   2. `verificado_em` é a data da conferência e `verificado_como` diz como foi
#      (oembed = API do YouTube, que devolve título e canal; pagina = HTML lido;
#      material-do-autor = veio dos planos/anexos do próprio autor, sem URL);
#   3. mídia é apoio, nunca fonte: a nota continua exigindo obra primária,
#      capítulo e página na seção "Trecho de apoio";
#   4. `conceitos` aponta para arquivos que existem em conceitos/ (a auditoria
#      cobra) e é o que liga a mídia ao nó da trilha.
#
# tipo: videoaula | curso | podcast | documentario | filme | artigo | resenha | verbete
# peso: aula-universitaria | curso-livre | divulgacao | obra-de-apoio
# verificado_como: oembed | pagina | material-do-autor

